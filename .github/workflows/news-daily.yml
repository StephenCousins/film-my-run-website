name: News daily
on:
  # Live since 26 Sep 2026.
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs at :00 when busy (none ran on 27 Sep).
    - cron: '17 5 * * *'   # 06:17 UK summer time, 05:17 winter
    # Catch-up: runs the news only if the 06:17 run didn't happen (news:daily --if-not-run-today).
    - cron: '17 7 * * *'   # 08:17 UK summer time, 07:17 winter
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Dry run (publish nothing)', type: boolean, default: true }
      max_stories: { description: 'One-off story cap (blank = the daily 4)', type: string, default: '' }
# One run at a time: two overlapping runs could publish the same event twice.
concurrency: { group: news-daily, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx prisma generate
      - run: npm run news:daily -- ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.max_stories != '') && format('--max {0}', inputs.max_stories) || '' }} ${{ github.event.schedule == '17 7 * * *' && '--if-not-run-today' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          NEWS_REPORT_TO: ${{ secrets.NEWS_REPORT_TO }}
      - if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with: { name: news-dry-run, path: news-dry-run/, if-no-files-found: ignore }
