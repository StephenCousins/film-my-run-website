name: News daily
on:
  # Live since 26 Sep 2026.
  # The server (src/lib/news/dispatch.ts, NEWS_DISPATCH_TOKEN) dispatches this workflow at 05:30 London
  # (retry 06:30, stop 11:00) so the news is done before the 07:30 push. The crons below are a backup only:
  # GitHub starts them hours late.
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs at :00 when busy (none ran on 27 Sep).
    - cron: '17 2 * * *'   # 03:17 UK summer time, 02:17 winter (GitHub starts it hours late; any time is fine)
    # Catch-up. Every scheduled run passes --if-not-run-today: GitHub fires this repo's
    # schedules hours late, so a late 06:17 must not repeat a run started by hand.
    - cron: '17 7 * * *'   # 08:17 UK summer time, 07:17 winter
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Dry run (publish nothing)', type: boolean, default: true }
      if_not_run_today: { description: 'Skip if the daily run already completed today (the server dispatch sets this)', type: boolean, default: false }
      max_stories: { description: 'One-off story cap (blank = the daily 4)', type: string, default: '' }
# One run at a time: two overlapping runs could publish the same event twice.
concurrency: { group: news-daily, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx prisma generate
      # Writing and checking run on the owner's Claude subscription; OpenRouter if this fails.
      - run: npm install -g @anthropic-ai/claude-code
      - run: npm run news:daily -- ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} ${{ (github.event_name == 'workflow_dispatch' && inputs.max_stories != '') && format('--max {0}', inputs.max_stories) || '' }} ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.if_not_run_today)) && '--if-not-run-today' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          NEWS_REPORT_TO: ${{ secrets.NEWS_REPORT_TO }}
      - if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with: { name: news-dry-run, path: news-dry-run/, if-no-files-found: ignore }
