name: Weekly Shoe Update

on:
  schedule:
    # Every Sunday at 6:00 AM UK time (GMT)
    - cron: '0 6 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-shoes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Discover new shoes and refresh data
        run: |
          echo "## Weekly Shoe Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          http_code=$(curl -s -o /tmp/shoe-update.ndjson -w "%{http_code}" -X POST \
            "${{ secrets.SITE_URL }}/api/shoes/weekly-update" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 600)

          echo "Status: $http_code"

          if [ "$http_code" != "200" ]; then
            echo "::error::Shoe update failed with status $http_code"
            echo "**Failed** with HTTP $http_code" >> $GITHUB_STEP_SUMMARY
            cat /tmp/shoe-update.ndjson 2>/dev/null || true
            exit 1
          fi

          echo '```' >> $GITHUB_STEP_SUMMARY
          while IFS= read -r line; do
            message=$(echo "$line" | python3 -c "import sys,json; print(json.loads(sys.stdin.read()).get('message',''))" 2>/dev/null || echo "$line")
            echo "$message"
            echo "$message" >> $GITHUB_STEP_SUMMARY
          done < /tmp/shoe-update.ndjson
          echo '```' >> $GITHUB_STEP_SUMMARY
