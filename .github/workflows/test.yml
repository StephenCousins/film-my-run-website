name: Test
# Typecheck and tests on every push to main. Railway deploys on push regardless; turn on "Wait for CI" in the
# Railway service settings and a red run here holds the deploy.
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx prisma generate
      - run: npm run typecheck
      - run: npm test
